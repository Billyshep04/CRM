---
deployment:
  tasks:
    - export DEPLOYPATH=/home/webstamp/public_html/crm/
    - /bin/rsync -rltD --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r --exclude='.git/' --exclude='.env' --exclude='storage/' --exclude='bootstrap/cache/' --exclude='vendor/' ./ $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/storage/framework/cache/data $DEPLOYPATH/storage/framework/sessions $DEPLOYPATH/storage/framework/views $DEPLOYPATH/storage/logs
    - /bin/chmod 775 $DEPLOYPATH/storage $DEPLOYPATH/storage/framework $DEPLOYPATH/storage/framework/cache $DEPLOYPATH/storage/framework/cache/data $DEPLOYPATH/storage/framework/sessions $DEPLOYPATH/storage/framework/views $DEPLOYPATH/storage/logs $DEPLOYPATH/bootstrap/cache
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/*.php
    - php $DEPLOYPATH/artisan optimize:clear || true
    - php $DEPLOYPATH/artisan migrate --force
    - php $DEPLOYPATH/artisan db:seed --class=RolePermissionSeeder --force
    - php $DEPLOYPATH/artisan db:seed --class=LeadScoringProfileSeeder --force
    - php $DEPLOYPATH/artisan db:seed --class=WordpressProfileSeeder --force
    - php $DEPLOYPATH/artisan queue:restart || true
